<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%"><defs><linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#090d16"/></linearGradient><linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#818cf8"/><stop offset="50%" stop-color="#c084fc"/><stop offset="100%" stop-color="#f43f5e"/></linearGradient><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-12px) rotate(2deg); } 100% { transform: translateY(0px) rotate(0deg); } } @keyframes pulseGlow { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.05); } } @keyframes waveFlow { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -200; } } .bg-wave { fill: none; stroke: url(#accentGrad); stroke-width: 2; opacity: 0.25; stroke-dasharray: 10 15; animation: waveFlow 12s linear infinite; } .floating-card { animation: float 6s ease-in-out infinite; } .pulse-bg { transform-origin: center; animation: pulseGlow 4s ease-in-out infinite; } .title-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: #ffffff; } .subtitle-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 18px; fill: #cbd5e1; } .pill-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }</style></defs><rect width="1200" height="320" rx="16" fill="url(#bgGrad)"/><circle cx="150" cy="80" r="160" fill="#4f46e5" class="pulse-bg"/><circle cx="1050" cy="240" r="140" fill="#e11d48" class="pulse-bg" style="animation-delay: 2s;"/><path class="bg-wave" d="M -50 200 Q 300 100 600 220 T 1250 150"/><path class="bg-wave" d="M -50 240 Q 300 140 600 260 T 1250 190" style="animation-duration: 8s;"/><g class="floating-card" transform="translate(820, 50)"><rect width="320" height="220" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.85"/><rect width="320" height="36" rx="12" fill="#1e293b"/><circle cx="20" cy="18" r="5" fill="#f43f5e"/><circle cx="36" cy="18" r="5" fill="#fbbf24"/><circle cx="52" cy="18" r="5" fill="#10b981"/><text x="75" y="23" font-family="monospace" font-size="12" fill="#94a3b8">compatibility_stack.sys</text><rect x="25" y="60" width="120" height="32" rx="6" fill="#312e81" stroke="#6366f1" stroke-width="1"/><text x="85" y="81" font-family="monospace" font-size="11" fill="#c7d2fe" text-anchor="middle">Windows / macOS</text><path d="M 85 92 L 85 118" stroke="#818cf8" stroke-width="2"/><rect x="25" y="118" width="270" height="40" rx="6" fill="url(#accentGrad)"/><text x="160" y="143" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">Linux Compatibility Layer</text><path d="M 160 158 L 160 178" stroke="#38bdf8" stroke-width="2"/><rect x="25" y="178" width="270" height="30" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/><text x="160" y="197" font-family="monospace" font-size="11" fill="#f0f9ff" text-anchor="middle">Linux Kernel / POSIX / Vulkan</text></g><g transform="translate(60, 90)"><text x="0" y="0" class="title-text" filter="url(#glow)">Awesome Linux Compatibility Layer 🐧⚡</text><text x="0" y="38" class="subtitle-text">Curated Ecosystem of Windows/macOS Translators, Emulators &amp; Subsystems</text><g transform="translate(0, 75)"><rect x="0" y="0" width="110" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1"/><text x="55" y="18" class="pill-text" text-anchor="middle">🍷 Wine &amp; Proton</text><rect x="120" y="0" width="110" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1"/><text x="175" y="18" class="pill-text"